    <style>
  /*
   * Final UI (approved design 2026-09-29): colours from the school logo (maroon and gold),
   * IBM Plex Sans Arabic for Arabic and English. Logical properties everywhere, so RTL and LTR (D41) both work.
   * Status colours stay semantic (green / amber / blue / red / grey) and always come with an icon and a word (23 §22).
   */
  :root {
    --bg: #f5f3ee; --card: #ffffff; --text: #1c2430; --muted: #5b6570; --line: #e3ded3; --line-strong: #d6d0c3;
    --primary: #7a1f2b; --primary-dark: #5a1520; --primary-soft: #f3e3e1; --gold: #c9a14a;
    --side: #4a0f1a; --side-active: #6e1a29; --side-text: #f3e6de; --side-muted: #e3c9b6; --side-line: #6b2a36;
    --danger: #a8321f; --ok: #0d5a45; --warn: #7a4a00; --info: #1d4f86;
    --ok-bg: #e2f1ec; --warn-bg: #fdf3e1; --info-bg: #e6eef8; --bad-bg: #fdecea; --neutral-bg: #ecebe8;
    --radius: 12px; --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* layout rules below must never reveal a hidden element */
  html, body { height: 100%; }
  body { margin: 0; font-family: 'IBM Plex Sans Arabic', system-ui, 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  a { color: var(--primary); }

  /* --- shell ------------------------------------------------------------------ */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 252px; flex-shrink: 0; background: var(--side); color: var(--side-text); display: flex; flex-direction: column; gap: 6px;
    padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 18px; }
  .brand img { width: 52px; height: 52px; object-fit: contain; background: #fff; border-radius: 12px; padding: 3px; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  #brand-name { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .brand-sub { font-size: 12px; color: var(--side-muted); }
  #nav { display: flex; flex-direction: column; gap: 2px; }
  #nav button { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font: inherit; font-size: 15px; color: var(--side-text); text-align: start; min-height: 44px; }
  #nav button::before { content: ''; width: 8px; height: 8px; border-radius: 4px; background: #a0636c; flex-shrink: 0; }
  #nav button:hover { background: rgba(255, 255, 255, .07); }
  #nav button.active { background: var(--side-active); color: #fff; font-weight: 600; }
  #nav button.active::before { background: var(--gold); }
  .who { margin-top: auto; border-top: 1px solid var(--side-line); padding: 14px 8px 4px; font-size: 13px; color: var(--side-muted);
    display: flex; flex-direction: column; gap: 2px; word-break: break-all; }
  .who span:last-child { color: var(--side-text); font-weight: 600; }
  .signout { margin: 6px 8px 0; background: none; border: 1px solid var(--side-line); border-radius: 8px; color: var(--side-muted);
    font: inherit; font-size: 13px; padding: 6px 10px; cursor: pointer; text-align: start; }
  .signout:hover { color: #fff; border-color: var(--gold); }
  #signin .gsi { margin-top: 12px; min-height: 44px; }
  .signin-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 18px; color: var(--primary); }
  .signin-brand img { width: 56px; height: 56px; object-fit: contain; }
  .content { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
  .pagebar { height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 28px; background: #fbfaf7; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; }
  #page-title { margin: 0; font-size: 21px; font-weight: 700; flex-grow: 1; }
  .refresh, .icon-btn { height: 40px; min-width: 40px; background: #fff; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 14px;
    cursor: pointer; font: inherit; font-size: 14px; color: var(--text); }
  .refresh:hover, .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
  .menu-btn { font-size: 20px; padding: 0; width: 44px; }
  .scrim { position: fixed; inset: 0; background: rgba(20, 10, 12, .4); z-index: 19; }
  main { padding: 24px 28px 40px; width: 100%; max-width: 1400px; }
  .logo-preview { height: 72px; width: auto; max-width: 220px; object-fit: contain; border: 1px solid var(--line); border-radius: 10px; padding: 4px; background: #fff; }

  /* --- surfaces ---------------------------------------------------------------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 700; }
  .card h3, main h3 { font-size: 15px; margin: 18px 0 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar h2 { margin: 0; }
  .toolbar .spacer { flex: 1; }

  /* --- controls ---------------------------------------------------------------- */
  input, select, textarea { font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: #fff; color: var(--text); min-height: 42px; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: 2px solid var(--primary-soft); }
  textarea { min-height: 5rem; }
  button.btn, a.btn { font: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: #fff; cursor: pointer; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--primary-dark); color: #fff; }
  .btn.danger { color: var(--danger); border-color: #e3b9b2; }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.small { min-height: 32px; padding: 4px 12px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
  label .req { color: var(--danger); }
  .switch { display: inline-flex; flex-direction: row; align-items: center; gap: 8px; }
  .switch input { min-height: auto; width: 18px; height: 18px; accent-color: var(--primary); }

  /* --- tables ------------------------------------------------------------------ */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: start; padding: 12px 14px; border-bottom: 1px solid #efebe3; vertical-align: middle; }
  th { font-size: 13px; color: #4a5561; font-weight: 600; background: #f3f0e9; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fcfbf8; }
  td.actions { white-space: nowrap; text-align: end; }
  td.actions .btn { margin-inline-start: 6px; }
  table.compact th, table.compact td { padding: 7px 10px; }
  table.compact input[type=time] { width: 7.5rem; }
  td.small-text, .small-text { font-size: 13px; }
  tr.total-row td { font-weight: 700; background: #f7f4ee; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; }

  /* --- status badges: icon + word + colour ------------------------------------ */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--neutral-bg); color: #4a4a48; white-space: nowrap; }
  .badge-icon { font-size: 12px; line-height: 1; }
  .badge + .badge { margin-inline-start: 4px; }
  .badge.ACTIVE, .badge.APPROVED, .badge.AUTHORIZED { background: var(--ok-bg); color: var(--ok); }
  .badge.PENDING, .badge.SUSPENDED { background: var(--warn-bg); color: var(--warn); }
  .badge.UNDER_REVIEW { background: var(--info-bg); color: var(--info); }
  .badge.REJECTED, .badge.TERMINATED { background: var(--bad-bg); color: #8a1f17; }
  .badge.CANCELLED, .badge.DRAFT, .badge.INACTIVE, .badge.PROVISIONAL { background: var(--neutral-bg); color: #4a4a48; }

  /* --- text helpers -------------------------------------------------------------- */
  .muted { color: var(--muted); }
  .warn-text { color: var(--warn); }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .form-error { color: var(--danger); margin-top: 12px; min-height: 1.2em; font-size: 14px; }
  pre.json { background: #faf8f4; border: 1px solid var(--line); border-radius: 8px; padding: 8px; direction: ltr; text-align: left; white-space: pre-wrap;
    font-size: 12px; max-height: 30vh; overflow: auto; margin: 0; }

  /* --- dialogs ------------------------------------------------------------------- */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(600px, 95vw); box-shadow: 0 20px 60px rgba(40, 10, 16, .25); color: var(--text); }
  dialog::backdrop { background: rgba(30, 12, 16, .45); }
  dialog form, .dialog-body { padding: 22px 24px; }
  dialog h2 { margin: 0 0 16px; font-size: 18px; font-weight: 700; }
  .dialog-body h3 { font-size: 15px; margin: 16px 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid .full { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  ol.history { margin: 0; padding-inline-start: 1.2rem; font-size: 14px; }
  ol.history li { margin-bottom: 6px; }
  .file-preview { margin-top: 12px; }
  .file-preview img { display: block; max-width: 100%; max-height: 50vh; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }

  /* --- toast --------------------------------------------------------------------- */
  .toast { position: fixed; bottom: 20px; inset-inline-end: 20px; background: #2a1418; color: #fff; padding: 12px 16px; border-radius: 10px; z-index: 30;
    max-width: min(460px, 90vw); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }

  /* --- profile, balances, dashboard ------------------------------------------------ */
  dl.profile { display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; margin: 0; }
  dl.profile dt { color: var(--muted); }
  dl.profile.small { font-size: 13px; margin-top: 8px; gap: 3px 16px; }
  .balances { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .balance { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .balance h3 { margin: 0 0 6px; font-size: 15px; color: #4a5561; }
  .balance .big { font-size: 38px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-top: 8px; }
  .tile { font: inherit; text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; color: inherit; }
  .tile.link { cursor: pointer; } .tile.link:hover { border-color: var(--primary); }
  .tile:disabled { cursor: default; opacity: 1; }
  .tile-value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile-label { color: var(--muted); font-size: 13px; }
  .tile.warn .tile-value { color: var(--warn); } .tile.bad .tile-value { color: var(--danger); }
  ul.alerts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  ul.alerts li { padding: 10px 14px; border-radius: 10px; background: #eef1f4; }
  ul.alerts li.error { color: #8a1f17; background: var(--bad-bg); } ul.alerts li.warn { color: var(--warn); background: var(--warn-bg); }

  /* --- phone and tablet: the sidebar slides in from the start edge --------------------- */
  @media (max-width: 900px) {
    .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 20; transform: translateX(100%); transition: transform .2s ease; }
    [dir="ltr"] .sidebar { transform: translateX(-100%); }
    .shell.menu-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .3); }
    .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
    .pagebar { padding: 0 12px; height: 60px; }
    #page-title { font-size: 18px; }
    main { padding: 16px 12px 32px; }
    .card { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (min-width: 901px) { .menu-btn { display: none !important; } .scrim { display: none !important; } }
</style>

  </head>

      google.accounts.id.renderButton(slot, {
        theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill',
        locale: App.lang() === 'en' ? 'en' : 'ar',
      });
    });
  }

  function whenGsi(fn) {
    if (window.google && google.accounts && google.accounts.id) return fn();
    setTimeout(function () { whenGsi(fn); }, 150);
  }

  /** School name and logo: shown at once from this device's copy, refreshed from the server. */
  function refreshBranding() {
    post('getBranding', []).then(function (res) {
      if (!res || !res.ok) return;
      write('branding', JSON.stringify(res.data));
      App.applyBranding(res.data);
      if (document.querySelector('.signin-brand')) renderBrand(document.getElementById('signin'));
    });
  }

  function installButton() {
    var deferred = null;
    var button = App.el('button', { type: 'button', className: 'refresh', hidden: true }, ['تثبيت التطبيق']);
    var bar = document.querySelector('.pagebar');
    bar.insertBefore(button, document.getElementById('lang'));
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      button.hidden = false;
    });
    button.onclick = function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; button.hidden = true; });
    };
    window.addEventListener('appinstalled', function () { button.hidden = true; });
  }

  // --- push notifications and badge (D47, 24_PWA §7) -------------------------------------

  var FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';

  function pushSupported() {
    return !!(APP_CONFIG.firebase && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window) &&
      !isIos(); // iPhone: only once installed on the home screen (navigator.standalone)
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  /** Gets this device's Firebase token and registers it for the signed-in user. Needs permission already granted. */
  function subscribe() {
    return loadScript(FIREBASE_SDK + 'firebase-app-compat.js')
      .then(function () { return loadScript(FIREBASE_SDK + 'firebase-messaging-compat.js'); })
      .then(function () {
        if (!firebase.apps.length) firebase.initializeApp(APP_CONFIG.firebase);
        return navigator.serviceWorker.ready;
      })
      .then(function (registration) {
        return firebase.messaging().getToken({ vapidKey: APP_CONFIG.firebase.vapidKey, serviceWorkerRegistration: registration });
      })
      .then(function (token) {
        if (!token) return;
        return App.api('registerPushDevice', { token: token, device: device() }).then(function () {
          write('pushToken', token);
          markSeen();
        });
      });
  }

  function setBadge(n) {
    try {
      if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
      else if (navigator.clearAppBadge) navigator.clearAppBadge();
    } catch (e) { /* badges are optional */ }
  }

  function clearBadge() { setBadge(0); }

  var lastSeen = 0;
  /** The app is open on this device: its notifications are read, so the icon count goes. */
  function markSeen() {
    if (Date.now() - lastSeen < 60000) return;
    lastSeen = Date.now();
    clearBadge();
    if (read('pushToken')) App.api('markNotificationsSeen', { token: read('pushToken') }).catch(function () {});
  }

  /** After sign-in: keep the subscription fresh, or offer it with a button (the permission needs a tap). */
  function afterSignIn() {
    markSeen();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') markSeen(); });
    if (!pushSupported()) return;
    if (Notification.permission === 'granted') {
      subscribe().catch(function () { /* push stays off; the app works */ });
      return;
    }
    if (Notification.permission !== 'default') return;
    var button = App.el('button', { type: 'button', className: 'refresh' }, ['تفعيل الإشعارات']);
    document.querySelector('.pagebar').insertBefore(button, document.getElementById('lang'));
    button.onclick = function () {
      Notification.requestPermission().then(function (permission) {
        if (permission !== 'granted') { button.remove(); return; }
        return App.busy(button, subscribe()).then(function () {
          button.remove();
          App.toast('تم تفعيل الإشعارات على هذا الجهاز.');
        });
      }).catch(function () { App.toast('تعذّر تفعيل الإشعارات على هذا الجهاز.'); });
    };
  }

  /** A notification tap opens ?page=…; the app starts on that page when the role has it. */
  function startPage() {
    try { return new URLSearchParams(location.search).get('page') || ''; } catch (e) { return ''; }
  }

  function boot() {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* the app still works */ });
    installButton();
    refreshBranding();
    window.addEventListener('online', function () {
      if (!document.getElementById('signin').hidden) location.reload();
    });
  }

  return {
    call: call, renderSignIn: renderSignIn, boot: boot, afterSignIn: afterSignIn, startPage: startPage,
    session: function () { return read('session'); },
    cachedBranding: function () { return read('branding') || '{"name_ar":"","name_en":"","logo":""}'; },
  };
})();

        return err.message;

          var m = err.message.match(MESSAGES[i][0]);
          if (m) {

      var submit = el('button', { type: 'submit', className: 'btn primary' }, [submitLabel]);
      var inputs = {};
      var grid = el('div', { className: 'grid' }, fields.map(function (f) {
        var input;

          input = el('select', { name: f.name, required: !!f.required }, f.options.map(function (o) {

          var note = el('p', { className: 'muted full' }, [f.value || '']);

        } else {
          input = el('input', { name: f.name, type: f.type || 'text', required: !!f.required });
          if (f.type === 'number') { input.min = '0'; input.step = 'any'; }

        if (f.value !== undefined && f.value !== null && f.type !== 'file') input.value = f.value;

        ]),

        who.appendChild(el('span', {}, [LABELS.roles[user.role] || user.role]));

        var langButton = document.getElementById('lang');
        langButton.hidden = false;
        langButton.onclick = function () {
          var next = state.lang === 'en' ? 'ar' : 'en';

            applyLanguage(res.language);

        var wanted = window.AppTransport ? AppTransport.startPage() : '';
        nav.querySelectorAll('button').forEach(function (b) {
          var allowed = b.dataset.roles.split(' ').indexOf(user.role) !== -1;

          b.onclick = function () { go(b.dataset.page); };

        // Reloads the current page's data from the server; the page keeps its own filters.
        var refresh = document.getElementById('refresh');
        refresh.hidden = false;
        refresh.onclick = function () { if (state.page) go(state.page); };

        menu.hidden = false;
        menu.onclick = function () { setMenu(!document.getElementById('shell').classList.contains('menu-open')); };

      LABELS: LABELS, api: api, errorText: errorText, toast: toast, el: el, badge: badge, busy: busy,
      formDialog: formDialog, options: options, readFile: readFile, download: download, start: start, go: go, pages: {},

      /** A bilingual record name in the interface language: name(record) or name(record, 'jobTitle'). */
      name: function (record, field) {

    var ALERTS = {
      UNMATCHED_FINGERPRINTS: function (a) { return a.count + ' رقم بصمة غير مربوط بموظف. أدخل رقم البصمة في ملفات الموظفين.'; },
      SYNC_NEVER: function () { return 'لم تصل أي بصمات من الجهاز بعد. تأكد من تشغيل البرنامج الوسيط في المدرسة.'; },
      SYNC_STALE: function (a) { return 'آخر مزامنة للبصمة كانت ' + a.detail.slice(0, 16).replace('T', ' ') + '. تأكد أن البرنامج الوسيط يعمل.'; },
      SYNC_ERRORS: function (a) { return a.count + ' مزامنة جزئية أو فاشلة خلال 7 أيام. راجع جدول SyncLogs.'; },
      REVIEW_OVERDUE: function (a) { return a.count + ' طلب ينتظر قرار HR منذ أكثر من ' + a.detail + ' أيام.'; },
      NO_ACADEMIC_YEAR: function () { return 'لا توجد سنة أكاديمية تشمل اليوم، فلا يمكن تقديم طلبات إجازة. أضفها من الإعدادات.'; },
      NO_DEFAULT_SCHEDULE: function () { return 'لا يوجد جدول دوام افتراضي، فلا يُحسب التأخير والغياب لمن ليس له جدول. حدده من الإعدادات.'; },
    };

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

    function rangeDates(range) {
      var now = new Date();
      if (range === 'week') {
        var start = new Date(now); start.setDate(now.getDate() - now.getDay()); // week starts Sunday
        return { from: fmt(start), to: fmt(now) };
      }
      if (range === 'month') return { from: fmt(new Date(now.getFullYear(), now.getMonth(), 1)), to: fmt(now) };
      if (range === 'custom') return { from: view.from || fmt(now), to: view.to || fmt(now) };
      return { from: fmt(now), to: fmt(now) };
    }

    function tile(label, value, page, tone) {
      var t = el('button', { type: 'button', className: 'tile' + (tone ? ' ' + tone : '') + (page ? ' link' : '') }, [
        el('div', { className: 'tile-value' }, [String(value)]), el('div', { className: 'tile-label' }, [label]),
      ]);
      if (page) t.addEventListener('click', function () { App.go(page); });
      else t.disabled = true;
      return t;
    }

    function render(root, user, refresh) {
      view.root = root;
      view.user = user;
      root.textContent = '';
      var r = rangeDates(view.range);

      var toolbar = el('div', { className: 'toolbar' }, [el('h2', {}, ['لوحة الموارد البشرية'])]);
      [['today', 'اليوم'], ['week', 'هذا الأسبوع'], ['month', 'هذا الشهر'], ['custom', 'فترة مخصصة']].forEach(function (x) {
        toolbar.appendChild(el('button', { type: 'button', className: 'btn small' + (view.range === x[0] ? ' primary' : ''),
          onclick: function () { view.range = x[0]; render(root, user); } }, [x[1]]));
      });
      if (view.range === 'custom') {
        var from = el('input', { type: 'date', value: r.from });
        var to = el('input', { type: 'date', value: r.to });
        var apply = function () { view.from = from.value; view.to = to.value; render(root, user); };
        from.addEventListener('change', apply);
        to.addEventListener('change', apply);
        toolbar.appendChild(from);
        toolbar.appendChild(to);
      }
      toolbar.appendChild(el('span', { className: 'spacer' }));
      toolbar.appendChild(el('button', { type: 'button', className: 'btn small', onclick: function () { render(root, user, true); } }, ['تحديث']));
      var card = el('div', { className: 'card' }, [toolbar, el('p', { className: 'muted' }, ['جارٍ التحميل…'])]);
      root.appendChild(card);

      App.api('getDashboard', { from: r.from, to: r.to, refresh: !!refresh }).then(function (d) {
        card.removeChild(card.lastChild);
        card.appendChild(el('p', { className: 'muted' }, [(d.from === d.to ? d.from : d.from + ' ← ' + d.to) +
          ' · آخر تحديث ' + (function (t) { return pad(t.getHours()) + ':' + pad(t.getMinutes()); })(new Date(d.generatedAt))]));
        var p = d.period;
        card.appendChild(el('div', { className: 'tiles' }, [
          tile('موظف نشط', p.activeEmployees, 'employees'),
          tile('حضور', p.present, 'attendance'),
          tile('غياب', p.absent, 'attendance', p.absent ? 'bad' : ''),
          tile('تأخير', p.late, 'attendance', p.late ? 'warn' : ''),
          tile('في إجازة', p.onLeave, 'leaves'),
          tile('مجموع الخصومات', p.deductionsTotal.toFixed(2), 'deductions'),
        ]));

        var q = d.pending;
        root.appendChild(el('div', { className: 'card' }, [
          el('h2', {}, ['بانتظار إجراء HR']),
          el('div', { className: 'tiles' }, [
            tile('إجازات', q.leaves, 'leaves', q.leaves ? 'warn' : ''),
            tile('ساعات استثناء', q.exceptions, 'exceptions', q.exceptions ? 'warn' : ''),
            tile('تصحيحات حضور', q.corrections, 'attendance', q.corrections ? 'warn' : ''),
            tile('حضور ناقص (هذا الشهر)', q.incomplete, 'attendance', q.incomplete ? 'warn' : ''),
            tile('يحتاج مراجعة (هذا الشهر)', q.reviewRequired, 'attendance', q.reviewRequired ? 'warn' : ''),
            tile('عند المدير الأكاديمي', q.awaitingAcademic, null),
          ]),
        ]));

        var alerts = el('div', { className: 'card' }, [el('h2', {}, ['تنبيهات'])]);
        if (!d.alerts.length) alerts.appendChild(el('p', { className: 'muted' }, ['لا توجد تنبيهات.']));
        else {
          alerts.appendChild(el('ul', { className: 'alerts' }, d.alerts.map(function (a) {
            var text = ALERTS[a.code] ? ALERTS[a.code](a) : a.code;
            return el('li', { className: a.severity }, [text]);
          })));
        }
        root.appendChild(alerts);
      }).catch(function (err) { card.lastChild.textContent = App.errorText(err); });
    }

    return render;
  })();
</script>

    <script>
  /** HR employee management (docs/03_EMPLOYEE_MODULE.md). */
  App.pages.employees = (function () {
    var el = App.el;
    var F = App.LABELS.fields;
    var STATUS = App.LABELS.status;
    var PAGE_SIZE = 25;
    var view = { query: { search: '', status: '', offset: 0 }, lookups: null, root: null, body: null, pager: null };

    function deptName(id) {
      var d = (view.lookups.departments || []).find(function (x) { return x.departmentId === id; });
      return d ? (App.name(d) || id) : id;
    }

    function levelName(id) {
      var l = (view.lookups.academicLevels || []).find(function (x) { return x.levelId === id; });
      return l ? (App.name(l) || id) : id;
    }

    // --- list ----------------------------------------------------------------

    function render(root) {
      view.root = root;
      root.textContent = '';
      var search = el('input', { type: 'search', placeholder: 'بحث بالاسم أو الرقم أو البريد', value: view.query.search });
      var status = el('select', {}, [el('option', { value: '' }, ['كل الحالات'])].concat(
        Object.keys(STATUS).map(function (s) { return el('option', { value: s }, [STATUS[s]]); })));
      status.value = view.query.status;
      var timer = null;
      search.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () { view.query.search = search.value; view.query.offset = 0; load(); }, 300);
      });
      status.addEventListener('change', function () { view.query.status = status.value; view.query.offset = 0; load(); });

      root.appendChild(el('div', { className: 'toolbar' }, [
        search, status, el('span', { className: 'spacer' }),
        el('button', { type: 'button', className: 'btn', onclick: openImport }, ['استيراد من Excel']),
        el('button', { type: 'button', className: 'btn primary', onclick: function () { openEmployeeForm(null); } }, ['إضافة موظف']),
      ]));

      view.body = el('tbody');
      root.appendChild(el('div', { className: 'table-wrap' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, [F.employeeCode, F.fullName, F.googleEmail, F.departmentId, F.academicLevelId, F.status, ''].map(function (h) {
          return el('th', {}, [h]);
        }))]),
        view.body,
      ])]));
      view.pager = el('div', { className: 'pager' });
      root.appendChild(view.pager);

      view.body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'empty' }, ['جارٍ التحميل…'])]));
      App.api('getEmployeeFormLookups')
        .then(function (lookups) { view.lookups = lookups; load(); })
        .catch(function (err) { showRowMessage(App.errorText(err)); });
    }

    function showRowMessage(text) {
      view.body.textContent = '';
      view.body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'empty' }, [text])]));
    }

    function load() {
      var q = { search: view.query.search, status: view.query.status, offset: view.query.offset, limit: PAGE_SIZE };
      if (!q.search) delete q.search;
      if (!q.status) delete q.status;
      App.api('listEmployees', q).then(function (res) {
        view.body.textContent = '';
        if (!res.items.length) return showRowMessage('لا يوجد موظفون مطابقون.');
        res.items.forEach(function (e) {
          view.body.appendChild(el('tr', {}, [
            el('td', {}, [e.employeeCode]),
            el('td', {}, [e.fullName]),
            el('td', {}, [e.googleEmail]),
            el('td', {}, [deptName(e.departmentId)]),
            el('td', {}, [e.academicLevelId ? levelName(e.academicLevelId) : '—']),
            el('td', {}, [App.badge(e.status, STATUS[e.status])]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openEmployeeForm(e); } }, ['تعديل']),
              el('button', { type: 'button', className: 'btn small', onclick: function () { openSalaryForm(e); } }, ['الراتب']),
              el('button', { type: 'button', className: 'btn small', onclick: function () { openStatusForm(e); } }, ['الحالة']),
              el('button', { type: 'button', className: 'btn small', onclick: function () { openRoleForm(e); } }, ['الدور']),
              el('button', { type: 'button', className: 'btn small', onclick: function () { openBalance(e); } }, ['الرصيد']),
            ]),
          ]));
        });
        renderPager(res);
      }).catch(function (err) { showRowMessage(App.errorText(err)); });
    }

    function renderPager(res) {
      view.pager.textContent = '';
      var from = res.total ? res.offset + 1 : 0;
      var to = Math.min(res.offset + res.items.length, res.total);
      var prev = el('button', { type: 'button', className: 'btn small', disabled: res.offset === 0, onclick: function () {
        view.query.offset = Math.max(0, res.offset - PAGE_SIZE); load();
      } }, ['السابق']);
      var next = el('button', { type: 'button', className: 'btn small', disabled: to >= res.total, onclick: function () {
        view.query.offset = res.offset + PAGE_SIZE; load();
      } }, ['التالي']);
      view.pager.appendChild(el('span', { className: 'muted' }, [from + '–' + to + ' من ' + res.total]));
      view.pager.appendChild(prev);
      view.pager.appendChild(next);
    }

    // --- dialogs -------------------------------------------------------------

    /** Shared modal form; reloads the list after a successful save. */
    function dialog(title, fields, submitLabel, onSubmit) {
      App.formDialog(title, fields, submitLabel, onSubmit, load);
    }

    // Inactive departments/levels are not offered, except the one already assigned (21_SETTINGS R2).
    function departmentOptions(current) {
      return [{ value: '', label: '— اختر —' }].concat(view.lookups.departments.filter(function (d) {
        return d.status !== 'INACTIVE' || d.departmentId === current;
      }).map(function (d) {
        return { value: d.departmentId, label: App.name(d) || d.departmentId };
      }));
    }

    function scheduleOptions(current) {
      return [{ value: '', label: 'الجدول الافتراضي' }].concat((view.lookups.workSchedules || []).filter(function (s) {
        return s.status !== 'INACTIVE' || s.scheduleId === current;
      }).map(function (s) {
        return { value: s.scheduleId, label: App.name(s) || s.scheduleId };
      }));
    }

    function levelOptions(current) {
      return [{ value: '', label: 'بلا مستوى' }].concat(view.lookups.academicLevels.filter(function (l) {
        return l.status !== 'INACTIVE' || l.levelId === current;
      }).map(function (l) {
        return { value: l.levelId, label: App.name(l) || l.levelId };
      }));
    }

    function openEmployeeForm(e) {
      var isNew = !e;
      var v = e || {};
      var fields = [
        { name: 'fullName', label: F.fullName, required: true, full: true, value: v.fullName },
        { name: 'googleEmail', label: F.googleEmail, type: 'email', required: true, value: v.googleEmail },
        { name: 'gender', label: F.gender, type: 'select', required: true, value: v.gender,
          options: [{ value: '', label: '— اختر —' }].concat(App.options(App.LABELS.genders)) },
        { name: 'departmentId', label: F.departmentId, type: 'select', required: true, options: departmentOptions(v.departmentId), value: v.departmentId },
        { name: 'jobTitle_ar', label: F.jobTitle_ar, value: v.jobTitle_ar },
        { name: 'jobTitle_en', label: F.jobTitle_en, value: v.jobTitle_en },
        { name: 'academicLevelId', label: F.academicLevelId, type: 'select', options: levelOptions(v.academicLevelId), value: v.academicLevelId },
        { name: 'workScheduleId', label: F.workScheduleId, type: 'select', options: scheduleOptions(v.workScheduleId), value: v.workScheduleId },
        { name: 'hireDate', label: F.hireDate, type: 'date', required: true, value: v.hireDate },
        { name: 'fingerprintId', label: F.fingerprintId + ' (User ID في الجهاز)', value: v.fingerprintId },
      ];
      if (isNew) {
        fields.unshift({ name: 'employeeCode', label: F.employeeCode, required: true });
        fields.push({ name: 'baseSalary', label: F.baseSalary, type: 'number', required: true });
        fields.push({ name: 'currency', label: F.currency, required: true, value: 'QAR' });
      }
      dialog(isNew ? 'إضافة موظف' : 'تعديل: ' + v.fullName, fields, isNew ? 'إضافة' : 'حفظ', function (values) {
        if (isNew) {
          return App.api('createEmployee', values).then(function () { App.toast('تمت إضافة الموظف وحساب دخوله.'); });
        }
        var patch = {};
        Object.keys(values).forEach(function (k) { if (values[k] !== (v[k] || '')) patch[k] = values[k]; });
        if (!Object.keys(patch).length) return Promise.resolve();
        return App.api('updateEmployee', v.employeeId, patch).then(function () { App.toast('تم حفظ التعديلات.'); });
      });
    }

    function openSalaryForm(e) {
      App.api('getEmployee', e.employeeId).then(function (full) {
        dialog('تغيير الراتب: ' + full.fullName + ' (الحالي ' + full.baseSalary + ' ' + full.currency + ')', [
          { name: 'baseSalary', label: 'الراتب الجديد', type: 'number', required: true },
          { name: 'effectiveFrom', label: F.effectiveFrom, type: 'date', required: true },
          { name: 'reason', label: F.reason, type: 'textarea', required: true, full: true },
        ], 'حفظ', function (values) {
          return App.api('changeEmployeeSalary', e.employeeId, values).then(function () { App.toast('تم تغيير الراتب وحفظ السجل السابق.'); });
        });
      }).catch(function (err) { App.toast(App.errorText(err)); });
    }

    function openStatusForm(e) {
      var options = Object.keys(STATUS).filter(function (s) { return s !== e.status; })
        .map(function (s) { return { value: s, label: STATUS[s] }; });
      dialog('تغيير الحالة: ' + e.fullName + ' (' + STATUS[e.status] + ')', [
        { name: 'status', label: 'الحالة الجديدة', type: 'select', required: true, options: options },
        { name: 'terminationDate', label: F.terminationDate + ' (لمنتهي الخدمة فقط)', type: 'date' },
        { name: 'reason', label: F.reason, type: 'textarea', required: true, full: true },
      ], 'حفظ', function (values) {
        if (!values.terminationDate) delete values.terminationDate;
        return App.api('changeEmployeeStatus', e.employeeId, values).then(function () { App.toast('تم تغيير الحالة.'); });
      });
    }

    function openRoleForm(e) {
      App.api('getEmployeeAccount', e.employeeId).then(function (account) {
        var roles = App.LABELS.roles;
        dialog('تغيير الدور: ' + e.fullName + ' (' + (roles[account.role] || account.role) + ')', [
          { name: 'role', label: 'الدور الجديد', type: 'select', required: true,
            options: App.options(roles).filter(function (o) { return o.value !== account.role; }) },
          { name: 'reason', label: F.reason, type: 'textarea', required: true, full: true },
        ], 'حفظ', function (values) {
          return App.api('changeEmployeeRole', e.employeeId, values).then(function () { App.toast('تم تغيير الدور.'); });
        });
      }).catch(function (err) { App.toast(App.errorText(err)); });
    }

    // --- leave balance and adjustments (04 §32) ------------------------------------

    function openBalance(e, period) {
      Promise.all([App.api('getLeaveBalance', e.employeeId, period || ''), App.api('listLeaveAdjustments', e.employeeId, period || '')])
        .then(function (res) {
          var b = res[0];
          var history = res[1].filter(function (a) { return a.period === b.period; });
          var types = App.LABELS.leaveTypes;
          var table = el('table', { className: 'compact' }, [
            el('thead', {}, [el('tr', {}, ['النوع', 'الاستحقاق', 'التسويات', 'المستخدم', 'المعلّق', 'المتبقي'].map(function (h) { return el('th', {}, [h]); }))]),
            el('tbody', {}, b.types.filter(function (t) { return t.hasBalance; }).map(function (t) {
              return el('tr', {}, [types[t.leaveType], t.entitlement, (t.adjustments > 0 ? '+' : '') + t.adjustments, t.used, t.pending, t.remaining]
                .map(function (v) { return el('td', {}, [String(v)]); }));
            })),
          ]);
          var log = el('ul', { className: 'small-text' }, history.length ? history.map(function (a) {
            return el('li', {}, [(a.units > 0 ? '+' : '') + a.units + ' ' + types[a.leaveType] + ' · ' + a.reason + ' · ' + a.createdBy + ' · ' + a.createdAt.slice(0, 10)]);
          }) : [el('li', { className: 'muted' }, ['لا توجد تسويات لهذه السنة.'])]);
          var periodSelect = el('select', {}, b.periods.map(function (p) { return el('option', { value: p }, [p]); }));
          periodSelect.value = b.period;
          App.formDialog('رصيد الإجازات: ' + e.fullName, [
            { name: 'summary', type: 'custom', label: '', element: el('div', { className: 'full' }, [
              el('label', {}, [el('span', {}, ['السنة الأكاديمية']), periodSelect]), table,
              el('h3', {}, ['سجل التسويات']), log, el('h3', {}, ['تسوية جديدة']),
            ]), read: function () { return periodSelect.value; } },
            { name: 'leaveType', label: 'نوع الإجازة', type: 'select', required: true,
              options: [{ value: 'CASUAL', label: types.CASUAL }, { value: 'SICK', label: types.SICK }] },
            { name: 'adjustmentType', label: 'النوع', type: 'select', required: true,
              options: [{ value: 'ADD', label: 'إضافة أيام' }, { value: 'DEDUCT', label: 'خصم أيام' }] },
            { name: 'units', label: 'عدد الأيام', type: 'number', required: true },
            { name: 'reason', label: 'السبب', type: 'textarea', required: true, full: true },
            { name: 'hint', type: 'note', value: 'التسوية لا تُعدَّل ولا تُحذف. لتصحيح خطأ أضف تسوية معاكسة واذكر السبب.' },
          ], 'حفظ التسوية', function (values) {
            return App.api('adjustLeaveBalance', {
              employeeId: e.employeeId, period: values.summary, leaveType: values.leaveType,
              adjustmentType: values.adjustmentType, units: values.units, reason: values.reason,
            }).then(function () { App.toast('تم حفظ التسوية.'); });
          }, null, function () {
            periodSelect.addEventListener('change', function () {
              var dlg = periodSelect.closest('dialog');
              dlg.close();
              openBalance(e, periodSelect.value);
            });
          });
        }).catch(function (err) { App.toast(App.errorText(err)); });
    }

    // --- import from Excel (03 §13) ------------------------------------------------------

    var IMPORT_HEADERS = ['الرقم الوظيفي', 'الاسم', 'البريد', 'الجنس', 'القسم', 'المستوى الأكاديمي', 'تاريخ التعيين', 'الراتب',
      'العملة', 'الوظيفة (عربي)', 'الوظيفة (إنجليزي)', 'جدول العمل', 'رقم البصمة'];

    /** Rows copied from Excel arrive as lines of tab-separated cells. */
    function parsePaste(text) {
      return text.replace(/\r/g, '').split('\n').map(function (line) { return line.split('\t'); });
    }

    function openImport() {
      var dlg = el('dialog');
      var area = el('textarea', { rows: 8, placeholder: 'الصق هنا الأسطر المنسوخة من Excel', dir: 'auto' });
      var result = el('div');
      var error = el('div', { className: 'form-error', role: 'alert' });
      var check = el('button', { type: 'button', className: 'btn' }, ['تحقق']);
      var run = el('button', { type: 'button', className: 'btn primary', disabled: true }, ['استيراد']);
      var copy = el('button', { type: 'button', className: 'btn small' }, ['نسخ عناوين الأعمدة']);
      copy.addEventListener('click', function () {
        var text = IMPORT_HEADERS.join('\t');
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
          App.toast('نُسخت العناوين. الصقها في أول سطر من ملف Excel.');
        }).catch(function () { area.value = text; area.select(); });
      });
      area.addEventListener('input', function () { run.disabled = true; result.textContent = ''; });

      check.addEventListener('click', function () {
        error.textContent = '';
        result.textContent = '';
        run.disabled = true;
        App.busy(check, App.api('previewEmployeeImport', parsePaste(area.value))).then(function (p) {
          var byRow = {};
          p.errors.forEach(function (e) { (byRow[e.row] = byRow[e.row] || []).push(App.errorText({ code: 'VALIDATION', message: e.message })); });
          result.appendChild(el('p', {}, [p.valid + ' من ' + p.rows + ' سليم.']));
          result.appendChild(el('div', { className: 'table-wrap' }, [el('table', { className: 'compact' }, [
            el('thead', {}, [el('tr', {}, ['السطر', 'الرقم الوظيفي', 'الاسم', 'النتيجة'].map(function (h) { return el('th', {}, [h]); }))]),
            el('tbody', {}, p.items.map(function (it) {

        el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', {}, [h]); }))]), body,

      var query = { view: mode };

    // --- new request ---------------------------------------------------------------

    function openRequestForm(onBehalf) {

        ? App.api('listEmployees', { status: 'ACTIVE', limit: 200 }).then(function (r) { return r.items; })

            options: [{ value: '', label: '— اختر —' }].concat(employees.map(function (e) {

          var input = { leaveType: values.leaveType, startDate: values.startDate, reason: values.reason };
          if (values.leaveType !== 'MATERNITY') input.endDate = values.endDate;
          if (values.employeeId) input.employeeId = values.employeeId;
          var file = values.leaveType === 'SICK' || values.leaveType === 'MATERNITY' ? values.attachment : null;
          if (file && file.size > MAX_BYTES) return Promise.reject({ code: 'VALIDATION', message: 'The file is larger than 5MB.' });
          return (file ? App.readFile(file) : Promise.resolve(null)).then(function (upload) {

        }, refresh, function (inputs) {
          function update() {
            // Maternity is offered only to female employees (D44, 03 E6); the server enforces it too.
            var eligible = employees
              ? (employees.find(function (e) { return e.employeeId === inputs.employeeId.value; }) || {}).gender === 'FEMALE'
              : !!(view.balance && view.balance.maternityEligible);
            var option = inputs.leaveType.querySelector('option[value="MATERNITY"]');
            option.hidden = !eligible;

            var sick = type === 'SICK';
            var maternity = type === 'MATERNITY';
            // Certificate: required for sick leave, optional for maternity (D44), hidden otherwise.
            inputs.attachment.wrapper.hidden = !(sick || maternity);
            inputs.attachment.required = sick;
            inputs.endDate.wrapper.hidden = maternity;
            inputs.endDate.required = !maternity;
            if (maternity) {

  /** Exception hours for all roles (docs/05_EXCEPTION_HOURS.md). The server decides what each role may see and do. */
  App.pages.exceptions = (function () {

    }

    function refresh() { render(view.root, view.user); }

    function hours(start, end) {
      if (!start || !end || end <= start) return 0;
      var m = function (t) { var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]); };
      return Math.round((m(end) - m(start)) / 60 * 100) / 100;

            .map(function (o) { return el('option', { value: o.value }, [o.label]); })));
        status.value = view.status;
        status.addEventListener('change', function () { view.status = status.value; refresh(); });
        toolbar.appendChild(status);

      if (mode !== 'queue' && (view.user.role === 'EMPLOYEE' || view.user.employeeId)) {
        toolbar.appendChild(el('button', { type: 'button', className: 'btn primary', onclick: openRequestForm }, ['طلب ساعات استثناء']));
      }

      card.appendChild(el('div', { className: 'table-wrap' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', {}, [h]); }))]), body,
      ])]));

      var query = { view: mode };
      if (mode === 'all' && view.status) query.status = view.status;
      App.api('listExceptionRequests', query).then(function (items) {
        body.textContent = '';

            ]),

    }

        { name: 'date', label: 'التاريخ', type: 'date', required: true, full: true },
        { name: 'startTime', label: 'من الساعة', type: 'time', required: true },
        { name: 'endTime', label: 'إلى الساعة', type: 'time', required: true },

    <script>
  /**
   * Attendance (docs/06_ATTENDANCE_MODULE.md). HR sees a day for everyone; employees see their own month;
   * academic managers see their own month and their level's attendance (D45).
   */
  App.pages.attendance = (function () {
    var el = App.el;
    var L = App.LABELS;
    var view = { root: null, user: null, date: '', month: '', levelEmployee: '', levelDate: '', levelMonth: '' };
    var STATUS = { PRESENT: 'حاضر', ABSENT: 'غائب', INCOMPLETE: 'ناقص', REVIEW_REQUIRED: 'يحتاج مراجعة' };

    function today() {
      var d = new Date();
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function render(root, user) {
      view.root = root;
      view.user = user;
      root.textContent = '';
      if (user.role === 'HR') {
        if (!view.date) view.date = today();
        root.appendChild(correctionsCard('queue', 'طلبات تصحيح بانتظار قرارك'));
        root.appendChild(dayCard());
        root.appendChild(unmatchedCard());
      } else {
        if (!view.month) view.month = today().slice(0, 7);
        if (user.role === 'ACADEMIC_MANAGER') root.appendChild(levelCard());
        root.appendChild(monthCard());
        root.appendChild(correctionsCard('mine', 'طلبات التصحيح'));
      }
    }

    function attributes(r) {
      var out = [];
      if (r.isLate) out.push(App.badge('REJECTED', 'تأخير ' + r.lateMinutes + ' د'));
      if (r.isEarlyLeave) out.push(App.badge('PENDING', 'خروج مبكر ' + r.earlyLeaveMinutes + ' د'));
      if (r.isOnLeave) out.push(App.badge('AUTHORIZED', 'إجازة'));
      if (r.isException) out.push(App.badge('AUTHORIZED', 'استثناء'));
      if (r.isHolidayWork) out.push(App.badge('AUTHORIZED', 'عمل في عطلة'));
      if (r.source === 'CORRECTION') out.push(App.badge('DRAFT', 'مُصحَّح'));
      return out;
    }

    function table(headers, body) {
      return el('div', { className: 'table-wrap' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, headers.map(function (h) { return el('th', {}, [h]); }))]), body,
      ])]);
    }

    function statusBadge(s) {
      var cls = { PRESENT: 'APPROVED', ABSENT: 'REJECTED', INCOMPLETE: 'PENDING', REVIEW_REQUIRED: 'UNDER_REVIEW' }[s] || '';
      return App.badge(cls, STATUS[s] || s);
    }

    // --- HR: one day ------------------------------------------------------------------

    function dayCard() {
      var card = el('div', { className: 'card' });
      var date = el('input', { type: 'date', value: view.date });
      date.addEventListener('change', function () { view.date = date.value; render(view.root, view.user); });
      var reprocess = el('button', { type: 'button', className: 'btn' }, ['إعادة المعالجة']);
      reprocess.addEventListener('click', function () {
        App.busy(reprocess, App.api('reprocessAttendance', view.date))
          .then(function (res) { App.toast('تمت المعالجة: ' + res.records + ' سجل تغيّر.'); render(view.root, view.user); })
          .catch(function (err) { App.toast(App.errorText(err)); });
      });
      card.appendChild(el('div', { className: 'toolbar' }, [el('h2', {}, ['حضور يوم']), date, el('span', { className: 'spacer' }), reprocess]));
      var body = el('tbody', {}, [el('tr', {}, [el('td', { colSpan: 6, className: 'empty' }, ['جارٍ التحميل…'])])]);
      card.appendChild(table(['الموظف', 'الرقم', 'دخول', 'خروج', 'الحالة', 'ملاحظات', ''], body));
      App.api('listAttendance', { date: view.date }).then(function (items) {
        body.textContent = '';
        if (!items.length) {
          body.appendChild(el('tr', {}, [el('td', { colSpan: 6, className: 'empty' }, ['لا توجد سجلات لهذا اليوم. تظهر السجلات بعد وصول البصمات ومعالجتها.'])]));
          return;
        }
        items.forEach(function (r) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [r.employeeName]), el('td', {}, [r.employeeCode]),
            el('td', {}, [r.checkIn || '—']), el('td', {}, [r.checkOut || '—']),
            el('td', {}, [statusBadge(r.status)]), el('td', {}, attributes(r)),
            el('td', { className: 'actions' }, [el('button', { type: 'button', className: 'btn small',
              onclick: function () { openCorrection(r, true); } }, ['تصحيح'])]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
      return card;
    }

    // --- corrections (06 §12) ------------------------------------------------------------

    /** direct=true: HR corrects immediately (C6); otherwise the employee requests (C1). */
    function openCorrection(r, direct) {
      App.formDialog((direct ? 'تصحيح حضور: ' + r.employeeName + ' ' : 'طلب تصحيح حضور ') + r.date, [
        { name: 'current', type: 'note', value: 'المسجل الآن: دخول ' + (r.checkIn || '—') + '، خروج ' + (r.checkOut || '—') + '. اترك الحقل فارغًا إن لم يتغير.' },
        { name: 'requestedCheckIn', label: 'وقت الدخول الصحيح', type: 'time' },
        { name: 'requestedCheckOut', label: 'وقت الخروج الصحيح', type: 'time' },
        { name: 'reason', label: 'السبب', type: 'textarea', required: true, full: true },
      ], direct ? 'حفظ التصحيح' : 'إرسال الطلب', function (values) {
        var input = { attendanceId: r.attendanceId, reason: values.reason };
        if (values.requestedCheckIn) input.requestedCheckIn = values.requestedCheckIn;
        if (values.requestedCheckOut) input.requestedCheckOut = values.requestedCheckOut;
        return App.api(direct ? 'correctAttendanceDirectly' : 'requestAttendanceCorrection', input).then(function () {
          App.toast(direct ? 'تم التصحيح وإعادة معالجة اليوم.' : 'تم إرسال طلب التصحيح إلى الموارد البشرية.');
        });
      }, function () { render(view.root, view.user); });
    }

    function correctionsCard(mode, title) {
      var card = el('div', { className: 'card' }, [el('h2', {}, [title])]);
      var showEmployee = view.user.role === 'HR';
      var headers = (showEmployee ? ['الموظف'] : []).concat(['التاريخ', 'المسجل', 'المطلوب', 'السبب', 'الحالة', '']);
      var body = el('tbody');
      card.appendChild(table(headers, body));
      App.api('listAttendanceCorrections', { view: mode }).then(function (items) {
        if (!items.length) {
          body.appendChild(el('tr', {}, [el('td', { colSpan: headers.length, className: 'empty' }, [mode === 'queue' ? 'لا شيء بانتظارك.' : 'لا توجد طلبات.'])]));
          return;
        }
        items.forEach(function (c) {
          var actions = [];
          if (c.canDecide) {
            actions.push(el('button', { type: 'button', className: 'btn small primary', onclick: function () { decide(c, 'APPROVE'); } }, ['اعتماد']));
            actions.push(el('button', { type: 'button', className: 'btn small danger', onclick: function () { decide(c, 'REJECT'); } }, ['رفض']));
          }
          if (c.canCancel) {
            actions.push(el('button', { type: 'button', className: 'btn small', onclick: function (ev) {
              App.busy(ev.target, App.api('cancelAttendanceCorrection', c.correctionId))
                .then(function () { App.toast('تم إلغاء الطلب.'); render(view.root, view.user); })
                .catch(function (err) { App.toast(App.errorText(err)); });
            } }, ['إلغاء']));
          }
          var last = (c.history || []).slice(-1)[0];
          var cells = showEmployee ? [el('td', {}, [c.employeeName])] : [];
          body.appendChild(el('tr', {}, cells.concat([
            el('td', {}, [c.date]),
            el('td', {}, [(c.currentCheckIn || '—') + ' / ' + (c.currentCheckOut || '—')]),
            el('td', {}, [(c.requestedCheckIn || '—') + ' / ' + (c.requestedCheckOut || '—')]),
            el('td', {}, [c.reason, c.status === 'REJECTED' && last && last.comment ? el('div', { className: 'muted' }, ['سبب الرفض: ' + last.comment]) : null]),
            el('td', {}, [App.badge(c.status, L.requestStatus[c.status])]),

    <script>

    var LINE_STATUS = { CALCULATED: 'محسوب', APPROVED: 'معتمد', ADJUSTED: 'معدَّل بعد إعادة الحساب', REJECTED: 'معفى', LOCKED: 'مقفل' };

        var b = el('button', { type: 'button', className: 'btn ' + cls }, [label]);

            .catch(function (err) { App.toast(App.errorText(err)); });
        });

      action(data.state === 'OPEN' ? 'احسب' : 'أعد الحساب', 'primary', function () {
        return App.api('calculateDeductions', view.period).then(function (r) {

        el('thead', {}, [el('tr', {}, ['الموظف', 'الأيام', 'المبلغ'].map(function (h) { return el('th', {}, [h]); }))]), body,
      ])])]);

        cells = cells.concat([
          el('td', {}, [l.sourceDate]), el('td', {}, [SOURCES[l.sourceType] || l.sourceType]), el('td', {}, [String(l.units)]),
          el('td', {}, [money(l.rate)]), el('td', {}, [money(l.amount)]),

        if (hr) {
          var canWaive = ['CALCULATED', 'APPROVED', 'ADJUSTED'].indexOf(l.status) !== -1;
          cells.push(el('td', { className: 'actions' }, canWaive ? [el('button', { type: 'button', className: 'btn small', onclick: function () { waive(l); } }, ['إعفاء'])] : []));

      }));
      return el('div', {}, [el('h3', {}, ['التفاصيل']), el('div', { className: 'table-wrap' }, [el('table', {}, [

      ])])]);

        { name: 'info', type: 'note', value: (SOURCES[l.sourceType] || l.sourceType) + '، ' + l.units + ' يوم، ' + money(l.amount) },
        { name: 'reason', label: 'سبب الإعفاء', type: 'textarea', required: true, full: true },

      show.addEventListener('click', apply);
      inputs.departmentId.addEventListener('change', function () { inputs.employeeId.value = ''; apply(); });
      ['employeeId', 'period'].concat((cfg.extras || []).map(function (x) { return x.name; })).forEach(function (k) {
        if (inputs[k]) inputs[k].addEventListener('change', apply);
      });

      function fillFilters(f) {
        f.departments.forEach(function (d) { inputs.departmentId.appendChild(el('option', { value: d.value }, [d.label])); });
        f.employees.filter(function (e) { return !q.departmentId || e.departmentId === q.departmentId; })
          .forEach(function (e) { inputs.employeeId.appendChild(el('option', { value: e.value }, [e.label])); });
        inputs.departmentId.value = q.departmentId || '';
        inputs.employeeId.value = q.employeeId || '';
      }
      function fillPeriods(periods, chosen) {
        periods.forEach(function (p) { inputs.period.appendChild(el('option', { value: p }, [p])); });
        inputs.period.value = chosen;
      }
      if (view.filters) fillFilters(view.filters);
      if (inputs.period && view.periods) fillPeriods(view.periods, q.period);

      App.api(cfg.get, q).then(function (r) {
        if (!view.filters) fillFilters(r.filters);
        view.filters = r.filters;
        if (inputs.period) {
          if (!view.periods) fillPeriods(r.periods, r.period);
          view.periods = r.periods;
          inputs.period.value = r.period;
          q.period = r.period;
        }
        content.textContent = '';
        cfg.draw(content, r);
      }).catch(function (err) { content.textContent = App.errorText(err); });
    }

    // --- attendance (12 §22) ----------------------------------------------------------

    function renderAttendance(card, toolbar) {
      renderFiltered(card, toolbar, { key: 'attendance', get: 'getAttendanceReport', exportMethod: 'exportAttendanceReport', range: 'dates',
        draw: function (content, r) {
          if (!r.summary.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا توجد سجلات حضور في هذه الفترة.']));
            return;
          }
          content.appendChild(table(
            ['الرقم الوظيفي', 'الاسم', 'القسم', 'الأيام', 'حضور', 'غياب', 'إجازة', 'بصمة ناقصة', 'مراجعة', 'تأخير (مرات / دقائق)', 'خروج مبكر (مرات / دقائق)'],
            r.summary.map(function (s) {
              return [s.employeeCode, s.employeeName, s.department, s.days, s.present, s.absent, s.onLeave, s.incomplete, s.review,
                s.lateCount + ' / ' + s.lateMinutes, s.earlyCount + ' / ' + s.earlyMinutes];
            })));
          if (r.lines.length) {
            content.appendChild(el('h3', {}, ['التفاصيل اليومية']));
            content.appendChild(table(['التاريخ', 'الدخول', 'الخروج', 'الحالة', 'التأخير', 'الخروج المبكر', 'ملاحظات'],
              r.lines.map(function (l) {
                var notes = [];
                if (l.isException) notes.push('استثناء معتمد');
                if (l.corrected) notes.push('مصحَّح');
                if (l.isHolidayWork) notes.push('عمل في عطلة');
                return [l.date, l.checkIn || '—', l.checkOut || '—', ATT_STATUS[l.status] || l.status,
                  l.lateMinutes ? l.lateMinutes + ' د' : '', l.earlyLeaveMinutes ? l.earlyLeaveMinutes + ' د' : '', notes.join('، ')];
              })));
          } else {
            content.appendChild(el('p', { className: 'muted' }, [r.lineCount + ' سجل يومي. اختر موظفًا لعرض تفاصيله هنا، أو نزّل ملف Excel/PDF لكل التفاصيل.']));
          }
        } });
    }

    // --- leave requests and balances (12 §23) ----------------------------------------

    function renderLeaves(card, toolbar) {
      var types = App.LABELS.leaveTypes;
      var statuses = {};
      ['PENDING', 'UNDER_REVIEW', 'APPROVED', 'REJECTED', 'CANCELLED'].forEach(function (k) { statuses[k] = App.LABELS.requestStatus[k]; });
      renderFiltered(card, toolbar, { key: 'leaves', get: 'getLeavesReport', exportMethod: 'exportLeavesReport', range: 'dates',
        extras: [{ name: 'leaveType', all: 'كل الأنواع', options: types }, { name: 'status', all: 'كل الحالات', options: statuses }],
        draw: function (content, r) {
          if (!r.summary.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا توجد طلبات إجازة في هذه الفترة.']));
            return;
          }
          content.appendChild(el('p', { className: 'muted' }, ['الأيام المعتمدة داخل الفترة لكل نوع.']));
          content.appendChild(table(['الرقم الوظيفي', 'الاسم', 'القسم', 'الطلبات', types.SICK, types.CASUAL, types.UNPAID, types.MATERNITY, 'معلّقة'],
            r.summary.map(function (s) {
              return [s.employeeCode, s.employeeName, s.department, s.requests, s.SICK, s.CASUAL, s.UNPAID, s.MATERNITY, s.open];
            })));
          if (r.lines.length) {
            content.appendChild(el('h3', {}, ['الطلبات']));
            content.appendChild(table(['النوع', 'من', 'إلى', 'المدة', 'مدفوعة', 'غير مدفوعة', 'الحالة', 'تاريخ التقديم'],
              r.lines.map(function (l) {
                var decided = l.status === 'APPROVED';
                return [types[l.leaveType] || l.leaveType, l.startDate, l.endDate || '—', l.days || '—',
                  decided ? l.paidDays : '', decided ? l.unpaidDays : '', App.LABELS.requestStatus[l.status] || l.status, l.submittedAt];
              })));
          } else {
            content.appendChild(el('p', { className: 'muted' }, [r.lineCount + ' طلب. اختر موظفًا لعرض طلباته هنا، أو نزّل ملف Excel/PDF لكل التفاصيل.']));
          }
        } });
    }

    // --- absence and late (12 §24) ------------------------------------------------------

    var DED_STATUS = { CALCULATED: 'محسوب', APPROVED: 'معتمد', ADJUSTED: 'معدَّل', LOCKED: 'مقفل', REJECTED: 'معفى' };

    function renderAbsenceLate(card, toolbar) {
      renderFiltered(card, toolbar, { key: 'absence', get: 'getAbsenceLateReport', exportMethod: 'exportAbsenceLateReport', range: 'dates',
        draw: function (content, r) {
          if (!r.summary.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا يوجد غياب ولا تأخير في هذه الفترة.']));
            return;
          }
          content.appendChild(table(['الرقم الوظيفي', 'الاسم', 'القسم', 'أيام الغياب', 'مرات التأخير', 'دقائق التأخير', 'أيام الخصم', 'معفى'],
            r.summary.map(function (s) {
              return [s.employeeCode, s.employeeName, s.department, s.absences, s.lates, s.lateMinutes, s.deductedDays, s.waived];
            })));
          content.appendChild(el('p', { className: 'muted' }, ['أيام الخصم من أسطر الخصومات المحسوبة (المعفاة لا تُحتسب). الغياب المغطى بإجازة لا يظهر هنا.']));
          if (r.lines.length) {
            content.appendChild(el('h3', {}, ['التفاصيل']));
            content.appendChild(table(['التاريخ', 'النوع', 'الدخول', 'التأخير', 'استثناء معتمد', 'الخصم', 'ملاحظات'],
              r.lines.map(function (l) {
                return [l.date, l.type === 'ABSENCE' ? 'غياب' : 'تأخير', l.type === 'LATE' ? l.checkIn : '—',
                  l.type === 'LATE' ? l.lateMinutes + ' د' : '', l.exception,
                  l.deduction ? l.deduction.units + ' يوم — ' + (DED_STATUS[l.deduction.status] || l.deduction.status) : 'لم يُحسب',
                  l.corrected ? 'مصحَّح' : ''];
              })));
          } else {
            content.appendChild(el('p', { className: 'muted' }, [r.lineCount + ' سطر. اختر موظفًا لعرض تفاصيله هنا، أو نزّل ملف Excel/PDF لكل التفاصيل.']));
          }
        } });
    }

    // --- exception hours (12 §25) -------------------------------------------------------

    function renderExceptions(card, toolbar) {
      var statuses = {};
      ['PENDING', 'UNDER_REVIEW', 'APPROVED', 'REJECTED', 'CANCELLED'].forEach(function (k) { statuses[k] = App.LABELS.requestStatus[k]; });
      renderFiltered(card, toolbar, { key: 'exceptions', get: 'getExceptionsReport', exportMethod: 'exportExceptionsReport', range: 'dates',
        extras: [{ name: 'status', all: 'كل الحالات', options: statuses }],
        draw: function (content, r) {
          if (!r.summary.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا توجد طلبات استثناء في هذه الفترة.']));
            return;
          }
          content.appendChild(table(['الرقم الوظيفي', 'الاسم', 'القسم', 'الطلبات', 'المعتمدة', 'الساعات المعتمدة', 'معلّقة', 'مرفوضة'],
            r.summary.map(function (s) {
              return [s.employeeCode, s.employeeName, s.department, s.requests, s.approved, s.approvedHours, s.open, s.rejected];
            })));
          if (r.lines.length) {
            content.appendChild(el('h3', {}, ['الطلبات']));
            content.appendChild(table(['التاريخ', 'من', 'إلى', 'الساعات', 'الحالة'], r.lines.map(function (l) {
              return [l.date, l.startTime, l.endTime, l.hours, App.LABELS.requestStatus[l.status] || l.status];
            })));
          } else {
            content.appendChild(el('p', { className: 'muted' }, [r.lineCount + ' طلب. اختر موظفًا لعرض طلباته هنا، أو نزّل ملف Excel/PDF لكل التفاصيل.']));
          }
        } });
    }

    // --- approvals (12 §26) ---------------------------------------------------------------

    var REQUEST_TYPES = { LEAVE: 'إجازة', EXCEPTION: 'ساعات استثناء', CORRECTION: 'تصحيح حضور', HOLIDAY_WORK: 'عمل في عطلة' };
    var STAGES = { ACADEMIC: 'موافقة المدير الأكاديمي', OPINION: 'رأي المدير الأكاديمي', HR: 'قرار HR' };

    function requestDetail(l) {
      var d = l.detail;
      if (l.type === 'LEAVE') return App.LABELS.leaveTypes[d.leaveType] + ' ' + d.from + (d.to && d.to !== d.from ? ' → ' + d.to : '');
      return d.date + (d.from || d.to ? ' ' + (d.from || '—') + '–' + (d.to || '—') : '');
    }

    function stepCell(h) {
      if (!h) return '';
      return el('div', {}, [App.LABELS.historyActions[h.action] || h.action, el('div', { className: 'muted' }, [h.by + ' · ' + h.at]),
        h.comment ? el('div', { className: 'muted' }, ['«' + h.comment + '»']) : null]);
    }

    function renderApprovals(card, toolbar) {
      var statuses = {};
      ['PENDING', 'UNDER_REVIEW', 'APPROVED', 'REJECTED', 'CANCELLED'].forEach(function (k) { statuses[k] = App.LABELS.requestStatus[k]; });
      var types = view.user.role === 'HR' ? REQUEST_TYPES
        : { LEAVE: REQUEST_TYPES.LEAVE, EXCEPTION: REQUEST_TYPES.EXCEPTION, HOLIDAY_WORK: REQUEST_TYPES.HOLIDAY_WORK };
      renderFiltered(card, toolbar, { key: 'approvals', get: 'getApprovalsReport', exportMethod: 'exportApprovalsReport', range: 'dates',
        extras: [{ name: 'requestType', all: 'كل الأنواع', options: types }, { name: 'status', all: 'كل الحالات', options: statuses },
          { name: 'track', all: 'كل المسارات', options: App.LABELS.tracks }],
        draw: function (content, r) {
          content.appendChild(el('p', { className: 'muted' }, ['الطلبات المقدَّمة في الفترة المختارة.' +
            (view.user.role === 'HR' ? '' : ' تظهر طلبات موظفي مستواك التي تشارك فيها فقط.')]));
          if (!r.summary.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا توجد طلبات في هذه الفترة.']));
            return;
          }
          content.appendChild(table(['النوع', 'المجموع', 'معتمدة', 'مرفوضة', 'ملغاة', 'مفتوحة', 'مفتوحة أكثر من ' + r.overdueDays + ' أيام', 'متوسط أيام القرار'],
            r.summary.map(function (s) {
              return [REQUEST_TYPES[s.type], s.total, s.approved, s.rejected, s.cancelled, s.open, s.overdue, s.averageDays === null ? '—' : s.averageDays];
            })));
          if (!r.lines.length) {
            content.appendChild(el('p', { className: 'muted' }, [r.lineCount + ' طلبًا. ضيّق الفلاتر لعرضها هنا، أو نزّل ملف Excel/PDF.']));
            return;
          }
          content.appendChild(el('h3', {}, ['الطلبات']));
          var body = el('tbody', {}, r.lines.map(function (l) {
            return el('tr', {}, [
              el('td', {}, [l.submitted]), el('td', {}, [l.employeeName]), el('td', {}, [REQUEST_TYPES[l.type]]),
              el('td', {}, [requestDetail(l)]), el('td', {}, [App.LABELS.tracks[l.track] || '—']),
              el('td', {}, [App.badge(l.status, App.LABELS.requestStatus[l.status]), l.stage ? el('div', { className: 'muted' }, ['بانتظار ' + STAGES[l.stage]]) : null,
                l.overdue ? el('div', { className: 'warn-text' }, ['متأخر']) : null]),
              el('td', {}, [stepCell(l.academic)]), el('td', {}, [stepCell(l.final)]),
              el('td', {}, [l.days === null ? '' : String(l.days)]),
            ]);
          }));
          content.appendChild(el('div', { className: 'table-wrap' }, [el('table', {}, [
            el('thead', {}, [el('tr', {}, ['التقديم', 'الموظف', 'النوع', 'التفاصيل', 'المسار', 'الحالة', 'المدير الأكاديمي', 'القرار النهائي', 'أيام']
              .map(function (h) { return el('th', {}, [h]); }))]), body,
          ])]));
        } });
    }

    // --- employee HR report (12 §27) ------------------------------------------------------

    function facts(pairs) {
      return el('dl', { className: 'profile' }, pairs.reduce(function (acc, p) {
        return acc.concat([el('dt', {}, [p[0]]), el('dd', {}, [String(p[1])])]);
      }, []));
    }

    function renderEmployee(card, toolbar) {
      renderFiltered(card, toolbar, { key: 'employee', get: 'getEmployeeReport', exportMethod: 'exportEmployeeReport', range: 'dates',
        draw: function (content, r) {
          if (!r.profile) {
            content.appendChild(el('div', { className: 'empty' }, ['اختر موظفًا لعرض تقريره الشامل.']));
            return;
          }
          var p = r.profile;
          var types = App.LABELS.leaveTypes;
          content.appendChild(el('h3', {}, [p.fullName + (p.employeeCode ? ' (' + p.employeeCode + ')' : '')]));
          content.appendChild(facts([['القسم', p.department || '—'], ['المستوى الأكاديمي', p.academicLevel || '—'], ['الوظيفة', p.jobTitle || '—'],
            ['تاريخ التعيين', p.hireDate || '—'], ['الحالة', App.LABELS.status[p.status] || p.status]]));

          var a = r.attendance.summary || {};
          var al = r.absenceLate.summary || {};
          var lv = r.leaves.summary || {};
          var ex = r.exceptions.summary || {};
          content.appendChild(el('h3', {}, ['الملخص']));
          content.appendChild(table(['الحضور', 'الغياب', 'إجازة', 'بصمة ناقصة', 'التأخير (مرات / دقائق)', 'الخروج المبكر (مرات / دقائق)',
            'ساعات استثناء معتمدة', 'أيام الخصم', 'مبلغ الخصم'], [[a.present || 0, al.absences || 0, a.onLeave || 0, a.incomplete || 0,
            (al.lates || 0) + ' / ' + (al.lateMinutes || 0), (a.earlyCount || 0) + ' / ' + (a.earlyMinutes || 0), ex.approvedHours || 0,
            r.deductions.days, r.deductions.amount.toFixed(2) + ' ' + r.deductions.currency]]));
          content.appendChild(table(['الإجازات المعتمدة داخل الفترة', types.SICK, types.CASUAL, types.UNPAID, types.MATERNITY, 'طلبات معلّقة'],
            [['الأيام', lv.SICK || 0, lv.CASUAL || 0, lv.UNPAID || 0, lv.MATERNITY || 0, lv.open || 0]]));
          if (r.balances) {
            var b = r.balances;
            content.appendChild(table(['الرصيد ' + b.period, 'الاستحقاق', 'التسويات', 'المستخدم', 'المعلّق', 'المتبقي'], ['CASUAL', 'SICK'].map(function (t) {
              return [types[t], b[t].entitlement, b[t].adjustments, b[t].used, b[t].pending, b[t].remaining];
            })));
          }

          content.appendChild(el('h3', {}, ['الحضور اليومي']));
          content.appendChild(r.attendance.lines.length ? table(['التاريخ', 'الدخول', 'الخروج', 'الحالة', 'التأخير', 'الخروج المبكر'],
            r.attendance.lines.map(function (l) {
              return [l.date, l.checkIn || '—', l.checkOut || '—', ATT_STATUS[l.status] || l.status,
                l.lateMinutes ? l.lateMinutes + ' د' : '', l.earlyLeaveMinutes ? l.earlyLeaveMinutes + ' د' : ''];
            })) : el('p', { className: 'muted' }, ['لا توجد سجلات.']));
          content.appendChild(el('h3', {}, ['الإجازات']));
          content.appendChild(r.leaves.lines.length ? table(['النوع', 'من', 'إلى', 'المدة', 'الحالة'], r.leaves.lines.map(function (l) {
            return [types[l.leaveType], l.startDate, l.endDate || '—', l.days || '—', App.LABELS.requestStatus[l.status] || l.status];
          })) : el('p', { className: 'muted' }, ['لا توجد طلبات.']));
          content.appendChild(el('h3', {}, ['ساعات الاستثناء']));
          content.appendChild(r.exceptions.lines.length ? table(['التاريخ', 'من', 'إلى', 'الساعات', 'الحالة'], r.exceptions.lines.map(function (l) {
            return [l.date, l.startTime, l.endTime, l.hours, App.LABELS.requestStatus[l.status] || l.status];
          })) : el('p', { className: 'muted' }, ['لا توجد طلبات.']));
          content.appendChild(el('h3', {}, ['الخصومات']));
          content.appendChild(r.deductions.lines.length ? table(['التاريخ', 'السبب', 'الأيام', 'المبلغ', 'الحالة'], r.deductions.lines.map(function (d) {
            return [d.date, DED_SOURCES[d.source] || d.source, d.units, d.amount.toFixed(2), DED_STATUS[d.status] || d.status];
          })) : el('p', { className: 'muted' }, ['لا توجد خصومات.']));
        } });
    }

    var DED_SOURCES = { ABSENCE: 'غياب', LATE: 'تأخير', UNPAID_LEAVE: 'إجازة بدون راتب', MATERNITY_UNPAID: 'أمومة بدون راتب' };

    function renderLeaveBalances(card, toolbar) {
      var types = App.LABELS.leaveTypes;
      renderFiltered(card, toolbar, { key: 'balances', get: 'getLeaveBalancesReport', exportMethod: 'exportLeaveBalancesReport', range: 'year',
        draw: function (content, r) {
          if (!r.rows.length) {
            content.appendChild(el('div', { className: 'empty' }, ['لا يوجد موظفون ضمن هذا الاختيار.']));
            return;
          }
          var cell = function (b) { return b.remaining + ' من ' + (b.entitlement + b.adjustments) + (b.pending ? ' (معلّق ' + b.pending + ')' : ''); };
          content.appendChild(table(['الرقم الوظيفي', 'الاسم', 'القسم', types.CASUAL + ': المتبقي', types.SICK + ': المتبقي', 'التسويات', 'بدون راتب'],
            r.rows.map(function (e) {
              var adj = e.CASUAL.adjustments + e.SICK.adjustments;
              return [e.employeeCode, e.employeeName, e.department, cell(e.CASUAL), cell(e.SICK), (adj > 0 ? '+' : '') + adj, e.unpaidDays];
            })));
          content.appendChild(el('p', { className: 'muted' }, ['المتبقي = الاستحقاق + التسويات − المعتمد. ملف Excel/PDF يعرض كل الأعمدة لكل نوع.']));
        } });
    }

    return render;
  })();
</script>
