    <script>
  /** Audit log viewer for HR (docs/14_AUDIT_LOG.md §17). Read-only. */
  App.pages.audit = (function () {
    var el = App.el;
    var PAGE = 50;
    var view = { root: null, user: null, query: {}, offset: 0, filters: null };
    var ACTIONS = {
      CREATE: 'إنشاء', UPDATE: 'تعديل', APPROVE: 'اعتماد', REJECT: 'رفض', CANCEL: 'إلغاء', RESTORE: 'استعادة',
      DISABLE: 'تعطيل', ADJUST: 'تسوية', RECALCULATE: 'إعادة حساب', LOCK: 'قفل', UNLOCK: 'فك قفل', EXPORT: 'تصدير',
    };

    function render(root, user) {
      view.root = root;
      view.user = user;
      root.textContent = '';
      var card = el('div', { className: 'card' }, [el('h2', {}, ['سجل التدقيق']),
        el('p', { className: 'muted' }, ['للقراءة فقط. يسجّل كل عملية حساسة ومن نفّذها ومتى.'])]);
      root.appendChild(card);
      var filters = el('div', { className: 'toolbar' });
      card.appendChild(filters);
      var body = el('tbody');
      var pager = el('div', { className: 'pager' });
      card.appendChild(el('div', { className: 'table-wrap' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, ['الوقت', 'المنفذ', 'العملية', 'نوع السجل', 'رقم السجل', 'النتيجة', ''].map(function (h) { return el('th', {}, [h]); }))]),
        body,
      ])]));
      card.appendChild(pager);

      var loadFilters = view.filters ? Promise.resolve(view.filters) : App.api('getAuditLogFilters');
      loadFilters.then(function (f) {
        view.filters = f;
        buildFilters(filters, f);
        load(body, pager);
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function select(name, label, options) {
      var s = el('select', {}, [el('option', { value: '' }, [label])].concat(options.map(function (o) {
        return el('option', { value: o.value }, [o.label]);
      })));
      s.value = view.query[name] || '';
      s.addEventListener('change', function () { set(name, s.value); });
      return s;
    }

    function set(name, value) {
      if (value) view.query[name] = value; else delete view.query[name];
      view.offset = 0;
      render(view.root, view.user);
    }

    function buildFilters(bar, f) {
      var from = el('input', { type: 'date', value: view.query.from || '', title: 'من' });
      var to = el('input', { type: 'date', value: view.query.to || '', title: 'إلى' });
      from.addEventListener('change', function () { set('from', from.value); });
      to.addEventListener('change', function () { set('to', to.value); });
      var entityId = el('input', { type: 'search', placeholder: 'رقم السجل', value: view.query.entityId || '' });
      entityId.addEventListener('change', function () { set('entityId', entityId.value.trim()); });
      bar.appendChild(from);
      bar.appendChild(to);
      bar.appendChild(select('actorUserId', 'كل المستخدمين', f.actors.map(function (a) { return { value: a.userId, label: a.label }; })));
      bar.appendChild(select('action', 'كل العمليات', f.actions.map(function (a) { return { value: a, label: ACTIONS[a] || a }; })));
      bar.appendChild(select('entityType', 'كل الأنواع', f.entityTypes.map(function (t) { return { value: t, label: t }; })));
      bar.appendChild(select('result', 'كل النتائج', [{ value: 'SUCCESS', label: 'نجحت' }, { value: 'FAILED', label: 'فشلت' }]));
      bar.appendChild(entityId);
      bar.appendChild(el('span', { className: 'spacer' }));
      if (Object.keys(view.query).length) {
        bar.appendChild(el('button', { type: 'button', className: 'btn small', onclick: function () {
          view.query = {}; view.offset = 0; render(view.root, view.user);
        } }, ['مسح الفلاتر']));
      }
      var exp = el('button', { type: 'button', className: 'btn' }, ['تنزيل Excel']);
      exp.addEventListener('click', function () {
        App.busy(exp, App.api('exportAuditLog', view.query)).then(function (file) {
          App.download(file);
          App.toast('تم التنزيل، وسُجّل التصدير في السجل.');
        }).catch(function (err) { App.toast(App.errorText(err)); });
      });
      bar.appendChild(exp);
    }

    function load(body, pager) {
      body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'empty' }, ['جارٍ التحميل…'])]));
      var q = Object.assign({ offset: view.offset, limit: PAGE }, view.query);
      App.api('searchAuditLog', q).then(function (res) {
        body.textContent = '';
        if (!res.items.length) {
          body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'empty' }, ['لا توجد سجلات مطابقة.'])]));
        }
        res.items.forEach(function (r) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [r.time]), el('td', {}, [r.actorName]), el('td', {}, [ACTIONS[r.action] || r.action]),
            el('td', {}, [r.entityType]), el('td', { className: 'small-text' }, [r.entityId]),
            el('td', {}, [App.badge(r.result === 'FAILED' ? 'REJECTED' : 'APPROVED', r.result === 'FAILED' ? 'فشلت' : 'نجحت')]),
            el('td', { className: 'actions' }, [el('button', { type: 'button', className: 'btn small', onclick: function () { details(r); } }, ['التفاصيل'])]),
          ]));
        });
        pager.textContent = '';
        var to = Math.min(res.offset + res.items.length, res.total);
        pager.appendChild(el('span', { className: 'muted' }, [(res.total ? res.offset + 1 : 0) + '–' + to + ' من ' + res.total]));
        pager.appendChild(el('button', { type: 'button', className: 'btn small', disabled: res.offset === 0, onclick: function () {
          view.offset = Math.max(0, res.offset - PAGE); render(view.root, view.user);
        } }, ['السابق']));
        pager.appendChild(el('button', { type: 'button', className: 'btn small', disabled: to >= res.total, onclick: function () {
          view.offset = res.offset + PAGE; render(view.root, view.user);
        } }, ['التالي']));
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function pretty(text) {
      if (!text) return '—';
      try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
    }

    function details(r) {
      var dlg = el('dialog');
      dlg.appendChild(el('div', { className: 'dialog-body' }, [
        el('h2', {}, [(ACTIONS[r.action] || r.action) + ' · ' + r.entityType]),
        el('dl', { className: 'profile' }, [
          el('dt', {}, ['الوقت']), el('dd', {}, [r.time]),
          el('dt', {}, ['المنفذ']), el('dd', {}, [r.actorName + ' (' + r.actorRole + ')']),
          el('dt', {}, ['رقم السجل']), el('dd', {}, [r.entityId || '—']),
          el('dt', {}, ['السبب']), el('dd', {}, [r.reason || '—']),
          el('dt', {}, ['النتيجة']), el('dd', {}, [r.result]),
        ]),
        el('h3', {}, ['القيمة القديمة']), el('pre', { className: 'json' }, [pretty(r.oldValue)]),
        el('h3', {}, ['القيمة الجديدة']), el('pre', { className: 'json' }, [pretty(r.newValue)]),
        el('div', { className: 'form-actions' }, [el('button', { type: 'button', className: 'btn', onclick: function () { dlg.close(); } }, ['إغلاق'])]),
      ]));
      dlg.addEventListener('close', function () { dlg.remove(); });
      document.body.appendChild(dlg);
      dlg.showModal();
    }

    return render;
  })();
</script>

    <script>
  /** Departments and academic levels (docs/21_SETTINGS.md §10). */
  App.pages.settings = (function () {
    var el = App.el;
    var L = App.LABELS;
    var F = L.fields;
    var root = null;

    function render(r) {
      root = r;
      root.textContent = '';
      var school = el('div', { className: 'card' });
      root.appendChild(school);
      renderSchool(school);
      var depts = el('div', { className: 'card' });
      var levels = el('div', { className: 'card' });
      var years = el('div', { className: 'card' });
      var notices = el('div', { className: 'card' });
      var schedules = el('div', { className: 'card' });
      var holidays = el('div', { className: 'card' });
      root.appendChild(years);
      root.appendChild(schedules);
      root.appendChild(holidays);
      renderSchedules(schedules);
      renderHolidays(holidays);
      root.appendChild(depts);
      root.appendChild(levels);
      renderYears(years);
      renderDepartments(depts);
      renderLevels(levels);
      root.appendChild(notices);
      renderNotifications(notices);
      var backups = el('div', { className: 'card' });
      root.appendChild(backups);
      renderBackups(backups);
    }

    // --- school name and logo (21 §2) ---------------------------------------------

    function renderSchool(box) {
      box.textContent = '';
      var b = BRANDING;
      box.appendChild(el('h2', {}, ['المدرسة']));
      box.appendChild(el('p', { className: 'muted' }, ['يظهران في الشريط العلوي وصفحة الدخول. إن تُرك الاسم الإنجليزي فارغًا يظهر العربي في الواجهة الإنجليزية.']));
      var nameAr = el('input', { type: 'text', value: b.name_ar || '', maxLength: 120 });
      var nameEn = el('input', { type: 'text', value: b.name_en || '', maxLength: 120, dir: 'ltr' });
      var saveName = el('button', { type: 'button', className: 'btn primary' }, ['حفظ الاسم']);
      saveName.addEventListener('click', function () {
        App.busy(saveName, App.api('saveSchoolNames', { name_ar: nameAr.value.trim(), name_en: nameEn.value.trim() }))
          .then(function (res) { App.applyBranding(res); App.toast('تم حفظ اسم المدرسة.'); })
          .catch(function (err) { App.toast(App.errorText(err)); });
      });
      box.appendChild(el('div', { className: 'grid' }, [
        el('label', {}, [el('span', {}, ['اسم المدرسة (عربي)']), nameAr]),
        el('label', {}, [el('span', {}, ['اسم المدرسة (إنجليزي)']), nameEn]),
      ]));
      box.appendChild(el('div', { className: 'toolbar' }, [saveName]));

      box.appendChild(el('h3', {}, ['الشعار']));
      box.appendChild(b.logo ? el('img', { src: b.logo, alt: '', className: 'logo-preview' }) : el('p', { className: 'muted' }, ['لا يوجد شعار.']));
      var file = el('input', { type: 'file', accept: 'image/png,image/jpeg' });
      var change = el('button', { type: 'button', className: 'btn' }, ['تغيير الشعار']);
      change.addEventListener('click', function () {
        if (!file.files[0]) { file.click(); return; }
      });
      file.addEventListener('change', function () {
        if (!file.files[0]) return;
        App.busy(change, App.readFile(file.files[0]).then(function (upload) { return App.api('setSchoolLogo', upload); }))
          .then(function (res) { App.applyBranding(res); App.toast('تم حفظ الشعار.'); renderSchool(box); })
          .catch(function (err) { App.toast(App.errorText(err)); file.value = ''; });
      });
      var tools = [el('label', {}, [el('span', {}, ['الشعار (PNG أو JPG حتى 500KB)']), file])];
      if (b.logo) {
        var remove = el('button', { type: 'button', className: 'btn danger' }, ['إزالة الشعار']);
        remove.addEventListener('click', function () {
          App.busy(remove, App.api('setSchoolLogo', null))
            .then(function (res) { App.applyBranding(res); App.toast('تمت إزالة الشعار.'); renderSchool(box); })
            .catch(function (err) { App.toast(App.errorText(err)); });
        });
        tools.push(remove);
      }
      box.appendChild(el('div', { className: 'toolbar' }, tools));
    }

    // --- work schedules (21 §4 W1–W4) -------------------------------------------

    var DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function renderSchedules(box) {
      var body = section(box, 'جداول الدوام', function () { openSchedule(null, box); }, ['الاسم', 'أيام العمل', F.status]);
      box.appendChild(el('p', { className: 'muted' }, ['الموظف الذي لم يُحدَّد له جدول يتبع الجدول الافتراضي.']));
      App.api('listWorkSchedules').then(function (items) {
        if (!fill(body, items, 3, 'لا توجد جداول بعد.')) return;
        items.forEach(function (s) {
          var working = s.days.filter(function (d) { return d.isWorkingDay; })
            .map(function (d) { return L.weekDays[d.dayOfWeek] + ' ' + d.startTime + '–' + d.endTime; }).join('، ');
          var actions = [el('button', { type: 'button', className: 'btn small', onclick: function () { openSchedule(s, box); } }, ['تعديل'])];
          if (!s.isDefault && s.status === 'ACTIVE') {
            actions.push(el('button', { type: 'button', className: 'btn small', onclick: function (ev) {
              App.busy(ev.target, App.api('setDefaultWorkSchedule', s.scheduleId))
                .then(function () { App.toast('أصبح الجدول الافتراضي.'); renderSchedules(box); })
                .catch(function (err) { App.toast(App.errorText(err)); });
            } }, ['اجعله افتراضيًا']));
          }
          body.appendChild(el('tr', {}, [
            el('td', {}, [name(s), s.isDefault ? el('span', { className: 'badge APPROVED' }, [' افتراضي']) : null]),
            el('td', { className: 'small-text' }, [working || '—']),
            el('td', {}, [App.badge(s.status, L.refStatus[s.status])]),
            el('td', { className: 'actions' }, actions),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openSchedule(s, box) {
      var v = s || {};
      var current = {};
      (v.days || []).forEach(function (d) { current[d.dayOfWeek] = d; });
      var rows = DAYS.map(function (day) {
        var d = current[day] || { isWorkingDay: day !== 'FRI' && day !== 'SAT', startTime: '07:00', endTime: '14:00' };
        var check = el('input', { type: 'checkbox', checked: d.isWorkingDay });
        var start = el('input', { type: 'time', value: d.startTime || '07:00' });
        var end = el('input', { type: 'time', value: d.endTime || '14:00' });
        function sync() { start.disabled = end.disabled = !check.checked; }
        check.addEventListener('change', sync);
        sync();
        return { day: day, check: check, start: start, end: end,
          row: el('tr', {}, [el('td', {}, [L.weekDays[day]]), el('td', {}, [check]), el('td', {}, [start]), el('td', {}, [end])]) };
      });
      var table = el('table', { className: 'compact' }, [
        el('thead', {}, [el('tr', {}, ['اليوم', 'يوم عمل', 'من', 'إلى'].map(function (h) { return el('th', {}, [h]); }))]),
        el('tbody', {}, rows.map(function (r) { return r.row; })),
      ]);
      App.formDialog(s ? 'تعديل جدول: ' + name(s) : 'إضافة جدول دوام', [
        { name: 'name_ar', label: F.name_ar, value: v.name_ar },
        { name: 'name_en', label: F.name_en, value: v.name_en },
        { name: 'status', label: F.status, type: 'select', required: true, options: App.options(L.refStatus), value: v.status || 'ACTIVE' },
        { name: 'days', type: 'custom', element: table, read: function () {
          return rows.map(function (r) {
            var working = r.check.checked;
            return { dayOfWeek: r.day, isWorkingDay: working, startTime: working ? r.start.value : '', endTime: working ? r.end.value : '' };
          });
        } },
      ], 'حفظ', function (values) {
        return App.api('saveWorkSchedule', v.scheduleId || '', values).then(function () { App.toast('تم حفظ الجدول.'); });
      }, function () { renderSchedules(box); });
    }

    // --- holidays (21 §6 H1–H3) ------------------------------------------------------

    function renderHolidays(box) {
      var body = section(box, 'العطل الرسمية', function () { openHoliday(null, box); }, ['العطلة', F.startDate, F.endDate, F.status]);
      box.appendChild(el('p', { className: 'muted' }, ['العطلة تشمل كل الموظفين، ولا تغيّر حساب مدة الإجازات.']));
      App.api('listHolidays').then(function (items) {
        if (!fill(body, items, 4, 'لا توجد عطل بعد.')) return;
        items.forEach(function (h) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [name(h)]), el('td', {}, [h.startDate]), el('td', {}, [h.endDate]),
            el('td', {}, [App.badge(h.status, L.refStatus[h.status])]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openHoliday(h, box); } }, ['تعديل']),
            ]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openHoliday(h, box) {
      var v = h || {};
      App.formDialog(h ? 'تعديل عطلة: ' + name(h) : 'إضافة عطلة رسمية', [
        { name: 'name_ar', label: F.name_ar, value: v.name_ar },
        { name: 'name_en', label: F.name_en, value: v.name_en },
        { name: 'startDate', label: F.startDate, type: 'date', required: true, value: v.startDate },
        { name: 'endDate', label: F.endDate, type: 'date', required: true, value: v.endDate },
        { name: 'status', label: F.status, type: 'select', required: true, options: App.options(L.refStatus), value: v.status || 'ACTIVE' },
      ], 'حفظ', function (values) {
        return App.api('saveHoliday', v.holidayId || '', values).then(function () { App.toast('تم حفظ العطلة.'); });
      }, function () { renderHolidays(box); });
    }

    // --- backups (21 §9 B1–B7) ---------------------------------------------------------

    function renderBackups(box) {
      var body = section(box, 'النسخ الاحتياطي', function () {
        App.formDialog('نسخة احتياطية يدوية الآن', [
          { name: 'note', label: 'سبب النسخة (مثل: قبل تعديل كبير)', type: 'textarea', required: true, full: true },
        ], 'إنشاء النسخة', function (values) {
          return App.api('createManualBackup', { note: values.note }).then(function (b) { App.toast('تم إنشاء ' + b.name); });
        }, function () { renderBackups(box); });
      }, ['النسخة', 'النوع', 'التاريخ']);
      box.querySelector('.toolbar .btn.primary').textContent = 'نسخة يدوية الآن';
      box.appendChild(el('p', { className: 'muted' }, [
        'نسخة آلية كل يوم الساعة 02:00، ويُحتفظ بآخر 30 نسخة آلية (الأقدم يُنقل إلى سلة Drive). النسخ اليدوية لا تُحذف. ',
        'الاسترجاع يتم يدويًا من مالك النظام (21 §9 B7).',
      ]));
      App.api('listBackups').then(function (items) {
        if (!fill(body, items, 3, 'لا توجد نسخ بعد.')) return;
        items.forEach(function (b) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [b.name]),
            el('td', {}, [App.badge(b.kind === 'MANUAL' ? 'APPROVED' : 'DRAFT', b.kind === 'MANUAL' ? 'يدوية' : 'آلية')]),
            el('td', {}, [b.createdAt]),
            el('td', {}),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    // --- email notifications (13 §16) -------------------------------------------

    function renderNotifications(box) {
      var body = section(box, 'إشعارات البريد', null, ['الحدث', 'العنوان']);
      var toolbar = box.querySelector('.toolbar');
      toolbar.removeChild(toolbar.querySelector('.btn.primary'));
      var toggle = el('label', { className: 'switch' }, [el('input', { type: 'checkbox' }), el('span', {}, ['إرسال البريد مفعّل'])]);
      toolbar.appendChild(toggle);
      var checkbox = toggle.querySelector('input');
      App.api('getNotificationsEnabled').then(function (on) { checkbox.checked = on; });
      checkbox.addEventListener('change', function () {
        var want = checkbox.checked;
        App.api('setNotificationsEnabled', want)
          .then(function () { App.toast(want ? 'تم تفعيل إرسال البريد.' : 'تم إيقاف إرسال البريد. تُحفظ الإشعارات دون إرسال.'); })
          .catch(function (err) { checkbox.checked = !want; App.toast(App.errorText(err)); });
      });
      box.appendChild(el('p', { className: 'muted' }, ['كل رسالة تحمل العربية ثم الإنجليزية. المتغيرات المتاحة: {{employeeName}} {{requestType_ar}} {{requestType_en}} {{period}} {{reason}} {{appUrl}}']));
      App.api('listNotificationTemplates').then(function (templates) {
        fill(body, templates, 2, '');
        templates.forEach(function (t) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [L.notificationEvents[t.templateKey] || t.templateKey]),
            el('td', {}, [t.subject_ar]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openTemplate(t, box); } }, ['تعديل']),
            ]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openTemplate(t, box) {
      App.formDialog('قالب: ' + (L.notificationEvents[t.templateKey] || t.templateKey), [
        { name: 'subject_ar', label: F.subject_ar, required: true, full: true, value: t.subject_ar },
        { name: 'body_ar', label: F.body_ar, type: 'textarea', required: true, full: true, value: t.body_ar },
        { name: 'subject_en', label: F.subject_en, required: true, full: true, value: t.subject_en },
        { name: 'body_en', label: F.body_en, type: 'textarea', required: true, full: true, value: t.body_en },
      ], 'حفظ', function (values) {
        return App.api('saveNotificationTemplate', t.templateKey, values).then(function () { App.toast('تم حفظ القالب.'); });
      }, function () { renderNotifications(box); });
    }

    function name(x) { return App.name(x); }

    function section(box, title, onAdd, headers) {
      box.textContent = '';
      box.appendChild(el('div', { className: 'toolbar' }, [
        el('h2', {}, [title]), el('span', { className: 'spacer' }),
        el('button', { type: 'button', className: 'btn primary', onclick: onAdd }, ['إضافة']),
      ]));
      var body = el('tbody', {}, [el('tr', {}, [el('td', { colSpan: headers.length + 1, className: 'empty' }, ['جارٍ التحميل…'])])]);
      box.appendChild(el('div', { className: 'table-wrap' }, [el('table', {}, [
        el('thead', {}, [el('tr', {}, headers.concat(['']).map(function (h) { return el('th', {}, [h]); }))]), body,
      ])]));
      return body;
    }

    function fill(body, items, cols, empty) {
      body.textContent = '';
      if (!items.length) {
        body.appendChild(el('tr', {}, [el('td', { colSpan: cols + 1, className: 'empty' }, [empty])]));
        return false;
      }
      return true;
    }

    // --- academic years (04 §31 L4) ----------------------------------------------

    function renderYears(box) {
      var body = section(box, F.academicYears, function () { openYear(null, box); }, [F.period, F.start, F.end]);
      App.api('listAcademicYears').then(function (years) {
        box._years = years;
        if (!fill(body, years, 3, 'لم تُحدَّد أي سنة أكاديمية. لا تُقبل طلبات إجازة قبل إضافتها.')) return;
        years.forEach(function (y, i) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [y.period]), el('td', {}, [y.start]), el('td', {}, [y.end]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openYear(i, box); } }, ['تعديل']),
            ]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openYear(index, box) {
      var years = (box._years || []).slice();
      var v = index === null ? {} : years[index];
      App.formDialog(index === null ? 'إضافة سنة أكاديمية' : 'تعديل سنة: ' + v.period, [
        { name: 'period', label: F.period + ' (مثل 2026-2027)', required: true, full: true, value: v.period },
        { name: 'start', label: F.start, type: 'date', required: true, value: v.start },
        { name: 'end', label: F.end, type: 'date', required: true, value: v.end },
        { name: 'hint', type: 'note', value: 'الأيام خارج السنوات المحددة لا تقبل طلبات إجازة، ورصيد الإجازات يتجدد مع كل سنة.' },
      ], 'حفظ', function (values) {
        var year = { period: values.period, start: values.start, end: values.end };
        if (index === null) years.push(year); else years[index] = year;
        return App.api('saveAcademicYears', years).then(function () { App.toast('تم الحفظ.'); });
      }, function () { renderYears(box); });
    }

    // --- departments -----------------------------------------------------------

    function renderDepartments(box) {
      var body = section(box, 'الأقسام', function () { openDepartment(null, box); },
        [F.name_ar, F.name_en, F.approvalTrack, F.status]);
      App.api('listDepartments').then(function (items) {
        if (!fill(body, items, 4, 'لا توجد أقسام بعد.')) return;
        items.forEach(function (d) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [d.name_ar]), el('td', {}, [d.name_en]),
            el('td', {}, [L.tracks[d.approvalTrack] || d.approvalTrack]),
            el('td', {}, [App.badge(d.status, L.refStatus[d.status])]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openDepartment(d, box); } }, ['تعديل']),
            ]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openDepartment(d, box) {
      var v = d || {};
      App.formDialog(d ? 'تعديل قسم: ' + name(d) : 'إضافة قسم', [
        { name: 'name_ar', label: F.name_ar, value: v.name_ar },
        { name: 'name_en', label: F.name_en, value: v.name_en },
        { name: 'approvalTrack', label: F.approvalTrack, type: 'select', required: true, full: true,
          options: [{ value: '', label: '— اختر —' }].concat(App.options(L.tracks)), value: v.approvalTrack },
        { name: 'status', label: F.status, type: 'select', required: true, options: App.options(L.refStatus), value: v.status || 'ACTIVE' },
      ], 'حفظ', function (values) {
        return App.api('saveDepartment', v.departmentId || '', values).then(function () {
          App.toast(d && d.approvalTrack !== values.approvalTrack
            ? 'تم الحفظ. مسار الموافقة الجديد يسري على الطلبات الجديدة فقط.' : 'تم الحفظ.');
        });
      }, function () { renderDepartments(box); });
    }

    // --- academic levels -------------------------------------------------------

    function renderLevels(box) {
      var body = section(box, 'المستويات الأكاديمية', function () { openLevel(null, box); },
        [F.name_ar, F.name_en, F.academicManagerUserId, F.status]);
      App.api('listAcademicLevels').then(function (items) {
        if (!fill(body, items, 4, 'لا توجد مستويات بعد.')) return;
        items.forEach(function (l) {
          body.appendChild(el('tr', {}, [
            el('td', {}, [l.name_ar]), el('td', {}, [l.name_en]),
            el('td', {}, [l.managerName || '—']),
            el('td', {}, [App.badge(l.status, L.refStatus[l.status])]),
            el('td', { className: 'actions' }, [
              el('button', { type: 'button', className: 'btn small', onclick: function () { openLevel(l, box); } }, ['تعديل']),
            ]),
          ]));
        });
      }).catch(function (err) { body.textContent = App.errorText(err); });
    }

    function openLevel(l, box) {
      var v = l || {};
      App.api('listManagerCandidates').then(function (managers) {
        var opts = [{ value: '', label: 'بلا مدير' }].concat(managers.map(function (m) { return { value: m.userId, label: m.label }; }));
        App.formDialog(l ? 'تعديل مستوى: ' + name(l) : 'إضافة مستوى', [
          { name: 'name_ar', label: F.name_ar, value: v.name_ar },
          { name: 'name_en', label: F.name_en, value: v.name_en },
          { name: 'academicManagerUserId', label: F.academicManagerUserId + ' (من له دور مدير أكاديمي)', type: 'select',
            full: true, options: opts, value: v.academicManagerUserId },
          { name: 'status', label: F.status, type: 'select', required: true, options: App.options(L.refStatus), value: v.status || 'ACTIVE' },
        ], 'حفظ', function (values) {
          return App.api('saveAcademicLevel', v.levelId || '', values).then(function () { App.toast('تم الحفظ.'); });
        }, function () { renderLevels(box); });
      }).catch(function (err) { App.toast(App.errorText(err)); });
    }

    return render;
  })();
</script>

    <script>AppTransport.boot(); App.start();</script>
  </body>
</html>
